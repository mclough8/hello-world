<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STRIPLASH</title><style>
:root{--bg:#140d20;--card:#251634;--hot:#ff3f8e;--hot2:#ff7a59;--gold:#ffd166;--muted:#bba9c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3b1850,#140d20 55%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 70px}.brand{text-align:center}.logo{font-size:54px;font-weight:1000;letter-spacing:-3px}.logo span{color:var(--hot)}.tag{color:var(--muted)}.stage{display:flex;justify-content:space-between;align-items:center;height:125px;padding:0 30px}.sil{font-size:84px;filter:grayscale(1);transform:scaleX(.9)}.card{background:#251634ee;border:1px solid #ffffff18;border-radius:22px;padding:18px;box-shadow:0 18px 55px #0007;margin:12px 0}.hidden{display:none!important}.center{text-align:center}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}input,textarea,button{width:100%;font:inherit;color:#fff;background:#120b1c;border:1px solid #ffffff20;border-radius:14px;padding:14px}button{border:0;background:linear-gradient(135deg,var(--hot),var(--hot2));font-weight:900;cursor:pointer;min-height:48px}.secondary{background:#3b2950}.ghost{background:#ffffff0a}.danger{background:#752a49}.code{font-size:46px;font-weight:1000;letter-spacing:8px;color:var(--gold)}.small{font-size:12px;color:var(--muted)}.prompt{font-size:25px;font-weight:950;line-height:1.2}.player{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff12}.status{padding:10px 12px;border-radius:12px;background:#ffffff0b;margin:10px 0}.analysis{margin-top:12px;padding:14px;background:#120b1c;border-radius:16px}.metric{display:flex;justify-content:space-between;margin:6px 0}.bonus{color:var(--gold);font-weight:900}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0d0814ee;padding:12px 14px;border-radius:12px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1}.overlay{position:fixed;inset:0;background:#12091be8;display:grid;place-items:center;padding:22px;z-index:30}.overlayCard{background:#2a1839;border-radius:24px;padding:24px;text-align:center;max-width:390px;width:100%}.big{font-size:52px;font-weight:1000;color:var(--gold)}
</style></head><body><main>
<div class="brand"><div class="logo">STRIP<span>LASH</span></div><div class="tag">The party game for terrible friends.</div><div class="stage"><div class="sil">💃</div><div class="sil">💃</div></div></div>
<section id="home" class="card"><h2>Play STRIPLASH</h2><input id="nick" maxlength="24" placeholder="Your nickname"><div style="height:10px"></div><button id="createBtn">CREATE ROOM</button><div style="height:12px"></div><div class="row"><input id="joinCode" maxlength="4" placeholder="ROOM CODE"><button id="joinBtn" class="secondary">JOIN</button></div><p class="small">One person creates a room. Everyone else joins from their own phone.</p></section>
<section id="lobby" class="card hidden center"><div class="small">ROOM CODE</div><div id="roomCode" class="code"></div><div id="players"></div><div id="lobbyStatus" class="status"></div><button id="startBtn" class="hidden">START GAME</button><button id="leaveBtn" class="ghost" style="margin-top:9px">LEAVE ROOM</button></section>
<section id="answer" class="card hidden"><div id="roundLabel" class="small"></div><p id="prompt" class="prompt"></p><textarea id="answerText" maxlength="220" rows="5" placeholder="Type something terrible..."></textarea><div style="height:9px"></div><button id="submitBtn">LOCK IT IN</button><div id="answerStatus" class="status"></div><div id="analysisBox" class="analysis hidden"></div><button id="votingBtn" class="hidden secondary">HOST: START VOTING</button><button class="restart danger hidden" style="margin-top:10px">RESTART GAME</button></section>
<section id="vote" class="card hidden"><div class="small">ANONYMOUS MATCHUP</div><p id="votePrompt" class="prompt"></p><div id="matchup"></div><div id="voteStatus" class="status"></div><button id="scoreBtn" class="hidden secondary">HOST: SCORE MATCHUP</button><button class="restart danger hidden" style="margin-top:10px">RESTART GAME</button></section>
<section id="results" class="card hidden center"><h2>Matchup scored</h2><p class="small">Votes matter most. Weak answers can lose points.</p><button id="nextMatchBtn" class="hidden">HOST: NEXT MATCHUP</button><p id="waitNext" class="small">Waiting for the host...</p><button class="restart danger hidden" style="margin-top:10px">RESTART GAME</button></section>
<section id="scores" class="card hidden"><h2>Leaderboard</h2><div id="leaderboard"></div><button id="nextPromptBtn" class="hidden">HOST: NEXT PROMPT</button><button class="restart danger hidden" style="margin-top:10px">RESTART GAME</button></section>
</main><div id="toast" class="toast"></div><div id="overlay"></div><script>
const SB_URL='https://rokitvbpvjzkjboqofpk.supabase.co';
const SB_KEY='sb_publishable_M4q-bqB3ETJKoU9lfIj4dQ_UgCeL6z-';
const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id), sections=['home','lobby','answer','vote','results','scores'];
let session=JSON.parse(localStorage.getItem('striplash_session')||'null'),snap=null,currentScreen='home',submittedKey='',votedMatch='',revealed=false;
function show(id){sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));if(currentScreen!==id){currentScreen=id;scrollTo(0,0)}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers,body:JSON.stringify(args||{})});const txt=await r.text();if(!r.ok)throw new Error((()=>{try{return JSON.parse(txt).message}catch{return txt||'Request failed'}})());return txt?JSON.parse(txt):null}
function save(){localStorage.setItem('striplash_session',JSON.stringify(session))}function leave(msg){localStorage.removeItem('striplash_session');session=null;snap=null;revealed=false;show('home');if(msg)toast(msg)}
function normalize(s){return String(s).toLowerCase().replace(/[0@]/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5|\$/g,'s').replace(/7/g,'t').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function hits(t,a){return a.reduce((n,w)=>n+(t.includes(w)?1:0),0)}
function nameAnalyze(name){const t=normalize(name), dirty=['fuck','shit','dick','cock','pussy','tits','cum','slut','whore','ass'], suggest=['daddy','mommy','thicc','hard','wet','strip','naked','booty','horny','shaft','ride','bang','suck','blow'];let s=hits(t,dirty)*18+hits(t,suggest)*11+(/69|xxx|420/.test(t)?12:0);s=Math.min(100,s);return{score:s,bonus:Math.min(200,Math.round(s/10)*20)}}
function analyze(answer,prompt){const t=normalize(answer),p=normalize(prompt);let sexual=Math.min(100,hits(t,['sex','cock','dick','pussy','anus','butt','boner','cum','semen','oral','blowjob','handjob','naked','orgasm','fetish','fist','rimjob','69'])*26);let dark=Math.min(100,hits(t,['corpse','dead','body','grave','funeral','morgue','murder','kill','necroph','cadaver'])*25);let gross=Math.min(100,hits(t,['shit','poop','piss','vomit','diarrhea','blood','rectum','fart','pus','mucus'])*23);let profanity=Math.min(100,hits(t,['fuck','shit','bitch','asshole','motherfucker','damn','cunt'])*22);let context=0,racism=0,sexism=0,antisemitism=0;if(p.includes('prostate')&&/(arm|elbow|fist|shoulder|whole hand|both hands|wrist)/.test(t)){context=95;sexual=Math.max(sexual,76)}if((p.includes('funeral')||p.includes('morgue'))&&/(body|corpse|dead)/.test(t)&&/(use|used|clean|bed|sex|ride|touch|stiff)/.test(t)){context=96;dark=Math.max(dark,90);sexual=Math.max(sexual,72)}if(/necroph/.test(t)){context=100;dark=100;sexual=Math.max(sexual,82)}const racialMarkers=['nigger','nigga','chink','gook','spic','wetback','coon','raghead'];const sexistMarkers=['femoid','dishwasher','slut','whore'];const antiMarkers=['kike','heeb','jewboy','greedy jew','gas chamber','oven joke'];racism=Math.min(100,hits(t,racialMarkers)*85);sexism=Math.min(100,hits(t,sexistMarkers)*70);antisemitism=Math.min(100,hits(t,antiMarkers)*85);if(/women|woman|girls|girl/.test(t)&&/(stupid|dumb|worthless|inferior|kitchen)/.test(t))sexism=Math.max(sexism,55);if(/jew|jews|jewish/.test(t)&&/(greedy|money|bank|oven|gas|control|media|world)/.test(t))antisemitism=Math.max(antisemitism,75);if(/black|asian|mexican|arab|indian|immigrant/.test(t)&&/(stupid|dumb|lazy|criminal|terrorist|inferior|monkey|dirty)/.test(t))racism=Math.max(racism,65);const boring=(answer.trim().length<8?100:answer.trim().length<15?50:0)+(['idk','nothing','whatever','lol','no idea','poop','sex','your mom','ur mom'].includes(answer.trim().toLowerCase())?150:0);const score=Math.min(100,Math.round(8+sexual*.42+dark*.19+gross*.13+profanity*.12+context*.32));const bonus=Math.min(300,Math.round((sexual*.8+dark*.5+gross*.45+profanity*.3+context*.85)/10)*10);return{score,bonus,sexual,dark,gross,profanity,context,racism,sexism,antisemitism,boring_penalty:Math.min(300,boring)}}
function renderAnalysis(a){$('analysisBox').classList.remove('hidden');$('analysisBox').innerHTML=`<b>Degeneracy ${a.score}/100</b> · <span class="bonus">+${a.bonus}</span>${a.boring_penalty?` · <b style="color:#ff7b8f">Boring risk -${a.boring_penalty}</b>`:''}<div class="metric"><span>Sexual</span><b>${a.sexual}</b></div><div class="metric"><span>Dark</span><b>${a.dark}</b></div><div class="metric"><span>Gross</span><b>${a.gross}</b></div><div class="metric"><span>Profanity</span><b>${a.profanity}</b></div><div class="metric"><span>Context</span><b>${a.context}</b></div><div class="metric"><span>Racism</span><b>${a.racism}</b></div><div class="metric"><span>Sexism</span><b>${a.sexism}</b></div><div class="metric"><span>Antisemitism</span><b>${a.antisemitism}</b></div>`;if(a.antisemitism>=45){const d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="overlayCard"><div class="big">⚠️</div><h2>ANTISEMITISM DETECTED</h2><p>OY VEY!</p></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}}
async function createRoom(){const name=$('nick').value.trim();if(!name)return toast('Enter a nickname first.');try{const a=nameAnalyze(name),d=await rpc('create_room',{p_name:name,p_name_raunch:a.score,p_name_bonus:a.bonus});session={...d,name,isHost:true};save();await refresh(true)}catch(e){toast(e.message)}}
async function joinRoom(){const name=$('nick').value.trim(),code=$('joinCode').value.trim().toUpperCase();if(!name||code.length!==4)return toast('Enter nickname and 4-character code.');try{const a=nameAnalyze(name),d=await rpc('join_room',{p_code:code,p_name:name,p_name_raunch:a.score,p_name_bonus:a.bonus});session={...d,name,isHost:false};save();await refresh(true)}catch(e){toast(e.message)}}
async function refresh(force=false){if(!session)return;try{snap=await rpc('room_snapshot',{p_code:session.code});if(!snap||!snap.room){leave('Game ended.');return}render()}catch(e){if(force)toast(e.message)}}
function render(){const r=snap.room,players=snap.players||[],me=players.find(p=>p.id===session.player_id);document.querySelectorAll('.restart').forEach(b=>b.classList.toggle('hidden',!session.isHost));$('roomCode').textContent=r.code;$('players').innerHTML=players.map(p=>`<div class="player"><span>${esc(p.name)} ${p.id===session.player_id?'(you)':''}</span><span class="small">READY</span></div>`).join('');if(r.status==='lobby'){show('lobby');$('lobbyStatus').textContent=`${players.length} player${players.length===1?'':'s'} joined. ${session.isHost?'Start when ready.':'Waiting for host.'}`;$('startBtn').classList.toggle('hidden',!session.isHost)}else if(r.status==='answering'){show('answer');if(!revealed&&me){revealed=true;const d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="overlayCard"><div class="small">SECRET NAME BONUS</div><div class="big">+${me.name_bonus}</div><h2>${me.name_bonus?'RAUNCHY NAME!':'CLEAN NAME'}</h2><button>LET'S GO</button></div>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove();setTimeout(()=>d.remove(),3500)}$('roundLabel').textContent=`ROUND ${r.round_no} · PROMPT ${r.prompt_index}/3`;$('prompt').textContent=r.prompt_text;const key=r.round_no+'-'+r.prompt_index;if(key===submittedKey){$('answerText').disabled=true;$('submitBtn').disabled=true;$('answerStatus').textContent=`Locked in. ${snap.submitted}/${players.length} answers submitted.`}else{$('answerText').disabled=false;$('submitBtn').disabled=false;$('answerStatus').textContent=`${snap.submitted}/${players.length} answers submitted.`}$('votingBtn').classList.toggle('hidden',!(session.isHost&&snap.submitted>=2))}else if(r.status==='voting'){show('vote');$('votePrompt').textContent=r.prompt_text;loadMatchup()}else if(r.status==='results'){show('results');$('nextMatchBtn').classList.toggle('hidden',!session.isHost);$('waitNext').classList.toggle('hidden',session.isHost)}else if(r.status==='scores'){show('scores');$('leaderboard').innerHTML=[...players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><span>${i+1}. <b>${esc(p.name)}</b></span><span><b>${p.score}</b> pts</span></div>`).join('');$('nextPromptBtn').classList.toggle('hidden',!session.isHost)}}
async function startGame(){try{await rpc('start_game',{p_room_id:session.room_id,p_host_token:session.host_token});revealed=false;await refresh(true)}catch(e){toast(e.message)}}
async function submitAnswer(){const ans=$('answerText').value.trim();if(!ans)return toast('Type an answer first.');try{const a=analyze(ans,snap.room.prompt_text);await rpc('submit_answer',{p_room_id:session.room_id,p_player_id:session.player_id,p_player_token:session.player_token,p_answer:ans,p_raunch:a.score,p_bonus:a.bonus,p_analysis:a});submittedKey=snap.room.round_no+'-'+snap.room.prompt_index;renderAnalysis(a);await refresh(true)}catch(e){toast(e.message)}}
async function prepareVoting(){try{await rpc('prepare_voting',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function loadMatchup(){try{const m=await rpc('active_matchup_snapshot',{p_code:session.code});if(!m)return;$('matchup').innerHTML=`<div class="status">A: “${esc(m.a_answer)}”<button style="margin-top:8px" onclick="castVote('${m.matchup_id}','${m.a_id}')">VOTE A</button></div><div class="status">B: “${esc(m.b_answer)}”<button style="margin-top:8px" onclick="castVote('${m.matchup_id}','${m.b_id}')">VOTE B</button></div>`;$('voteStatus').textContent=votedMatch===m.matchup_id?'Vote locked in.':`${m.votes||0} vote(s) cast.`;$('scoreBtn').classList.toggle('hidden',!session.isHost)}catch(e){toast(e.message)}}
window.castVote=async(mid,sid)=>{try{await rpc('cast_vote',{p_matchup_id:mid,p_player_id:session.player_id,p_player_token:session.player_token,p_submission_id:sid});votedMatch=mid;await loadMatchup()}catch(e){toast(e.message)}};
async function scoreMatch(){try{await rpc('score_current_matchup',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function nextMatch(){try{await rpc('next_matchup',{p_room_id:session.room_id,p_host_token:session.host_token});votedMatch='';await refresh(true)}catch(e){toast(e.message)}}
async function nextPrompt(){try{await rpc('next_prompt',{p_room_id:session.room_id,p_host_token:session.host_token});submittedKey='';votedMatch='';$('answerText').value='';$('analysisBox').classList.add('hidden');await refresh(true)}catch(e){toast(e.message)}}
async function restartGame(){if(!session?.isHost)return;if(!confirm('Restart game? Everyone will be kicked back to the main screen.'))return;try{await rpc('restart_game',{p_room_id:session.room_id,p_host_token:session.host_token});leave('Game restarted.')}catch(e){toast(e.message)}}
$('createBtn').addEventListener('click',createRoom);$('joinBtn').addEventListener('click',joinRoom);$('leaveBtn').addEventListener('click',()=>leave());$('startBtn').addEventListener('click',startGame);$('submitBtn').addEventListener('click',submitAnswer);$('votingBtn').addEventListener('click',prepareVoting);$('scoreBtn').addEventListener('click',scoreMatch);$('nextMatchBtn').addEventListener('click',nextMatch);$('nextPromptBtn').addEventListener('click',nextPrompt);document.querySelectorAll('.restart').forEach(b=>b.addEventListener('click',restartGame));
if(session){$('nick').value=session.name||'';refresh(true)}else show('home');setInterval(()=>{if(session)refresh(false)},1000);
</script></body></html>
