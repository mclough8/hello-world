<style>
:root{--bg:#160d20;--card:#251633;--card2:#160c20;--hot:#ff438d;--hot2:#ff775b;--gold:#ffd166;--muted:#c3b3cf;--green:#67e8ad;--red:#ff667f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#43205b 0,#21102e 38%,#100a18 78%);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,590px);margin:auto;padding:18px 15px 80px}.brand{text-align:center;padding:6px 0 8px}.logo{font-size:clamp(44px,13vw,66px);font-weight:1000;letter-spacing:-4px;line-height:.9}.logo span{color:var(--hot)}.tag{color:var(--muted);font-size:17px;margin-top:10px}.stage{height:150px;position:relative;margin:4px auto -3px;max-width:390px}.dancerSvg{position:absolute;top:0;width:116px;height:150px;filter:drop-shadow(0 12px 15px #0009)}.dancerSvg.left{left:19px}.dancerSvg.right{right:19px;transform:scaleX(-1)}.card{background:linear-gradient(180deg,#29183aee,#20122fee);border:1px solid #ffffff20;border-radius:25px;padding:19px;box-shadow:0 20px 60px #0008;margin:12px 0}.hidden{display:none!important}.center{text-align:center}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}input,textarea,button{width:100%;font:inherit;color:#fff;background:#110919;border:1px solid #ffffff25;border-radius:15px;padding:14px}textarea{resize:vertical;min-height:120px}button{border:0;background:linear-gradient(135deg,var(--hot),var(--hot2));font-weight:950;cursor:pointer;letter-spacing:.2px;min-height:49px}button:disabled{opacity:.5}.secondary{background:#49305d}.ghost{background:#ffffff0b;border:1px solid #ffffff27}.danger{background:linear-gradient(135deg,#8b244d,#c93650)}.code{font-size:48px;font-weight:1000;letter-spacing:9px;color:var(--gold)}.small{font-size:12px;color:var(--muted)}.prompt{font-size:26px;line-height:1.2;font-weight:950}.bonus{font-weight:950;color:var(--gold)}.player{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff13}.answer{padding:17px;background:#342047;border:2px solid #ffffff12;border-radius:18px;margin:10px 0;font-size:19px;font-weight:850}.answer button{margin-top:10px}.status{padding:10px 12px;border-radius:13px;background:#ffffff0b;margin:10px 0;font-size:13px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0c0713f2;border:1px solid #ffffff28;border-radius:14px;padding:12px 15px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:.18s;z-index:50}.toast.show{opacity:1}.restart{margin-top:15px}.analysis{margin-top:14px;padding:16px;border-radius:18px;background:#130a1d;border:1px solid #ffffff17}.analysis h3{margin:0 0 4px}.analysisScore{font-size:50px;font-weight:1000;color:var(--gold);line-height:1}.metric{display:grid;grid-template-columns:105px 1fr 34px;align-items:center;gap:8px;margin:8px 0;font-size:12px}.track{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#67dfff,var(--hot),var(--gold));border-radius:99px}.reveal{position:fixed;inset:0;background:#100817e8;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fadeIn .2s}.revealBox{width:min(430px,100%);background:#2b183a;border:2px solid #ffffff22;border-radius:28px;padding:28px;box-shadow:0 30px 80px #000}.revealBig{font-size:52px;font-weight:1000;color:var(--gold)}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.referee{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#10081799;animation:refPop 1.6s both}.refCard{background:#fff;color:#1a1020;border-radius:24px;padding:19px 21px;text-align:center;box-shadow:0 24px 80px #000c;transform:rotate(-3deg);max-width:320px}.refHead{width:94px;height:94px;border-radius:50%;background:#ffd9b8;margin:0 auto 10px;position:relative;border:8px solid #1d1730}.refHead:before{content:'!';position:absolute;inset:10px;border-radius:50%;background:#ffcd48;color:#1d1730;display:grid;place-items:center;font-size:46px;font-weight:1000}.refTitle{font-size:21px;font-weight:1000}.refSub{font-size:16px;font-weight:900;color:#8b254f}@keyframes refPop{0%{opacity:0;transform:scale(.5)}12%,78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}

<body>
<main>

<section id="home" class="card"><h2>Play STRIPLASH</h2><input id="nick" maxlength="24" autocomplete="off" placeholder="Your nickname"><div style="height:10px"></div><button id="createBtn">CREATE ROOM</button><div style="height:12px"></div><div class="row"><input id="joinCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ROOM CODE"><button id="joinBtn" class="secondary">JOIN</button></div><p class="small">One person creates a room. Everyone else joins from their own phone.</p></section>
<section id="lobby" class="card hidden center"><div class="small">ROOM CODE</div><div id="roomCode" class="code"></div><div id="players"></div><div id="lobbyStatus" class="status"></div><button id="startBtn" class="hidden">START GAME</button><button id="leaveBtn" class="ghost" style="margin-top:9px">LEAVE ROOM</button></section>

<section id="results" class="card hidden center"><div style="font-size:50px">🔥</div><h2>Matchup scored</h2><p class="small">Votes are the main event. Degeneracy bonuses add a little extra chaos.</p><button id="nextMatchBtn" class="hidden">HOST: NEXT MATCHUP</button><p id="waitNext" class="small">Waiting for the host...</p><button class="restart danger hidden">RESTART GAME</button></section>
<section id="scores" class="card hidden"><h2>Leaderboard</h2><div id="leaderboard"></div><button id="nextPromptBtn" class="hidden">HOST: NEXT PROMPT</button><button class="restart danger hidden">RESTART GAME</button></section>
</main><div id="toast" class="toast"></div><div id="overlay"></div>
<script>
const SB_URL='https://rokitvbpvjzkjboqofpk.supabase.co';
const SB_KEY='sb_publishable_M4q-bqB3ETJKoU9lfIj4dQ_UgCeL6z-';
const sb=supabase.createClient(SB_URL,SB_KEY);
const sections=['home','lobby','answer','vote','results','scores'];const $=id=>document.getElementById(id);
let session=JSON.parse(localStorage.getItem('striplash_session')||'null'),snap=null,currentScreen='home',submittedKey='',votedMatch='',nameRevealKey='';
function show(id){sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));if(currentScreen!==id){currentScreen=id;window.scrollTo({top:0,behavior:'auto'})}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function save(){localStorage.setItem('striplash_session',JSON.stringify(session))}
function leave(msg){localStorage.removeItem('striplash_session');session=null;snap=null;submittedKey='';votedMatch='';show('home');if(msg)toast(msg)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
function normalize(s){return String(s).toLowerCase().normalize('NFKD').replace(/[0@]/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5|\$/g,'s').replace(/7/g,'t').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function hits(t,list){let n=0;for(const x of list)if(t.includes(x))n++;return n}
function nameAnalyze(name){const t=normalize(name);let s=0;const explicit=['fuck','shit','dick','cock','pussy','tits','cum','slut','whore','ass'];const suggest=['daddy','mommy','thicc','hard','wet','strip','naked','booty','horny','shaft','ride','bang','suck','blow'];s+=hits(t,explicit)*18+hits(t,suggest)*11;if(/69|xxx|420/.test(t))s+=12;s=Math.min(100,s);return{score:s,bonus:Math.min(200,Math.round(s/10)*20)}}
function degenerateAnalyze(answer,prompt){const raw=String(answer),t=normalize(raw),p=normalize(prompt);const sexual=['sex','cock','dick','pussy','anus','butt','penetr','boner','erection','cum','semen','oral','blowjob','handjob','naked','nude','orgasm','threesome','fetish','kink','shaft','inside me','inside you','fist','rimjob','69'];const dark=['corpse','dead','body','bodies','grave','funeral','morgue','cremat','murder','kill','necroph','cadaver','suicide'];const gross=['shit','poop','piss','vomit','diarrhea','blood','rectum','fart','pus','mucus','semen'];const prof=['fuck','shit','bitch','asshole','motherfucker','damn','cunt'];
const sexistTerms=['bitch','slut','whore','femoid','dishwasher','gold digger'];const antisemiticTerms=['kike','heeb','jewboy','jewess','oven joke','gas chamber','hook nose','greedy jew'];const racialTerms=['nigger','nigga','chink','gook','spic','wetback','coon','raghead','sand nigger','monkey'];
let sexualScore=Math.min(100,hits(t,sexual)*28),darkScore=Math.min(100,hits(t,dark)*26),grossScore=Math.min(100,hits(t,gross)*25),profanityScore=Math.min(100,hits(t,prof)*24);let sexism=Math.min(100,hits(t,sexistTerms)*38),antisemitism=Math.min(100,hits(t,antisemiticTerms)*48),racism=Math.min(100,hits(t,racialTerms)*48),context=0;
if(/women|woman|girls|girl|female|wife|wives/.test(t)&&/(stupid|dumb|weak|inferior|kitchen|drive|belong|property|obey)/.test(t))sexism=Math.max(sexism,62);
if(/men|man|boys|boy|male|husband/.test(t)&&/(stupid|dumb|worthless|trash|inferior)/.test(t))sexism=Math.max(sexism,45);
if(/jew|jews|jewish/.test(t)&&/(greedy|money|bank|oven|gas|control|media|world|hook|nose|cheap)/.test(t))antisemitism=Math.max(antisemitism,70);
if(/black|asian|mexican|latino|arab|indian|white|immigrant/.test(t)&&/(stupid|dumb|lazy|criminal|terrorist|steal|inferior|monkey|dirty)/.test(t))racism=Math.max(racism,62);
if(p.includes('prostate')&&/(arm|elbow|fist|shoulder|whole hand|both hands|wrist)/.test(t)){context=Math.max(context,92);sexualScore=Math.max(sexualScore,72)}
if((p.includes('funeral')||p.includes('morgue')||p.includes('corpse'))&&/(body|bodies|corpse|dead/.test(t))&&/(use|used|clean|bed|sex|ride|touch|warm|stiff)/.test(t)){context=Math.max(context,96);darkScore=Math.max(darkScore,92);sexualScore=Math.max(sexualScore,70)}
if(/necroph/.test(t)){context=100;darkScore=100;sexualScore=Math.max(sexualScore,80)}
if(/inside|deeper|whole thing|both hands|all the way|bend over/.test(t)&&/(doctor|exam|butt|ass|rect|prostate|hole)/.test(p+' '+t))context=Math.max(context,74);
let raunch=Math.min(100,Math.round(8+sexualScore*.42+darkScore*.19+grossScore*.13+profanityScore*.12+context*.32));let bonus=Math.round((sexualScore*.8+darkScore*.5+grossScore*.45+profanityScore*.3+context*.85)/10)*10;bonus=Math.min(300,bonus);return{score:raunch,bonus,sexual:sexualScore,dark:darkScore,gross:grossScore,profanity:profanityScore,context,racism,sexism,antisemitism}}
function metric(label,v){return `<div class="metric"><span>${label}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`}
function renderAnalysis(a){$('analysisBox').classList.remove('hidden');$('analysisBox').innerHTML=`<h3>DEGENERACY ANALYSIS</h3><div class="analysisScore">${a.score}</div><div class="small">OUT OF 100 · BONUS <b class="bonus">+${a.bonus}</b></div>${metric('Sexual',a.sexual)}${metric('Dark',a.dark)}${metric('Gross-out',a.gross)}${metric('Profanity',a.profanity)}${metric('Context',a.context)}${metric('Racism',a.racism)}${metric('Sexism',a.sexism)}${metric('Antisemitism',a.antisemitism)}<p class="small">Racism, sexism and antisemitism are detection meters; they do not directly add bonus points.</p>`;if(a.antisemitism>=45)showAntisemitismRef()}
function showAntisemitismRef(){const d=document.createElement('div');d.className='referee';d.innerHTML=`<div class="refCard"><div class="refHead"></div><div class="refTitle">ANTISEMITISM DETECTED</div><div class="refSub">OY VEY!</div></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1650)}
function showNameReveal(me,r){const k=r.id+'-'+r.round_no;if(nameRevealKey===k)return;nameRevealKey=k;const d=document.createElement('div');d.className='reveal';d.innerHTML=`<div class="revealBox"><div class="small">YOUR SECRET STARTING BONUS</div><div class="revealBig">+${me.name_bonus}</div><h2>${me.name_bonus>=120?'FILTHY NAME!':me.name_bonus>0?'RAUNCHY NAME!':'CLEAN NAME'}</h2><p>${esc(me.name)}</p><button id="closeReveal">LET'S GO</button></div>`;document.body.appendChild(d);d.querySelector('#closeReveal').onclick=()=>d.remove();setTimeout(()=>{if(d.isConnected)d.remove()},4000)}
async function createRoom(){const name=$('nick').value.trim();if(!name)return toast('Enter a nickname first.');const a=nameAnalyze(name);try{const d=await rpc('create_room',{p_name:name,p_name_raunch:a.score,p_name_bonus:a.bonus});session={...d,name,isHost:true};save();await refresh(true)}catch(e){toast(e.message)}}
async function joinRoom(){const name=$('nick').value.trim(),code=$('joinCode').value.trim().toUpperCase();if(!name||code.length!==4)return toast('Enter a nickname and 4-character room code.');const a=nameAnalyze(name);try{const d=await rpc('join_room',{p_code:code,p_name:name,p_name_raunch:a.score,p_name_bonus:a.bonus});session={...d,name,isHost:false};save();await refresh(true)}catch(e){toast(e.message)}}
async function refresh(force=false){if(!session)return;try{snap=await rpc('room_snapshot',{p_code:session.code});if(!snap||!snap.room){leave('Game ended.');return}render()}catch(e){if(force)toast(e.message)}}
function render(){const r=snap.room,players=snap.players||[],me=players.find(x=>x.id===session.player_id);$('roomCode').textContent=r.code;document.querySelectorAll('.restart').forEach(b=>b.classList.toggle('hidden',!session.isHost));$('players').innerHTML=players.map(p=>`<div class="player"><span>${esc(p.name)} ${p.id===session.player_id?'(you)':''}</span><span class="small">READY</span></div>`).join('');if(r.status==='lobby'){show('lobby');$('lobbyStatus').textContent=`${players.length} player${players.length===1?'':'s'} joined. ${session.isHost?'Start when ready.':'Waiting for host.'}`;$('startBtn').classList.toggle('hidden',!session.isHost)}else if(r.status==='answering'){show('answer');if(me)showNameReveal(me,r);$('roundLabel').textContent=`ROUND ${r.round_no} · PROMPT ${r.prompt_index}/3`;$('prompt').textContent=r.prompt_text;const key=r.round_no+'-'+r.prompt_index;if(key!==submittedKey){$('answerText').disabled=false;$('submitBtn').disabled=false;$('answerStatus').textContent=`${snap.submitted}/${players.length} answers submitted.`}else{$('answerText').disabled=true;$('submitBtn').disabled=true;$('answerStatus').textContent=`Locked in. ${snap.submitted}/${players.length} answers submitted.`}$('votingBtn').classList.toggle('hidden',!(session.isHost&&snap.submitted>=2))}else if(r.status==='voting'){show('vote');$('votePrompt').textContent=r.prompt_text;loadMatchup()}else if(r.status==='results'){show('results');$('nextMatchBtn').classList.toggle('hidden',!session.isHost);$('waitNext').classList.toggle('hidden',session.isHost)}else if(r.status==='scores'){show('scores');const sorted=[...players].sort((a,b)=>b.score-a.score);$('leaderboard').innerHTML=sorted.map((p,i)=>`<div class="player"><span>${i+1}. <b>${esc(p.name)}</b></span><span><b>${p.score}</b> pts<div class="small">Name bonus +${p.name_bonus}</div></span></div>`).join('');$('nextPromptBtn').classList.toggle('hidden',!session.isHost)}}
async function startGame(){try{await rpc('start_game',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function submitAnswer(){const ans=$('answerText').value.trim();if(!ans)return toast('Type an answer first.');const a=degenerateAnalyze(ans,snap.room.prompt_text);try{await rpc('submit_answer',{p_room_id:session.room_id,p_player_id:session.player_id,p_player_token:session.player_token,p_answer:ans,p_raunch:a.score,p_bonus:a.bonus,p_analysis:a});submittedKey=snap.room.round_no+'-'+snap.room.prompt_index;renderAnalysis(a);$('answerText').disabled=true;$('submitBtn').disabled=true;await refresh(true)}catch(e){toast(e.message)}}
async function prepareVoting(){try{await rpc('prepare_voting',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function loadMatchup(){try{const m=await rpc('active_matchup_snapshot',{p_code:session.code});if(!m){$('matchup').innerHTML='<div class="status">No active matchup.</div>';return}$('matchup').innerHTML=`<div class="answer">A: “${esc(m.a_answer)}”<button onclick="castVote('${m.matchup_id}','${m.a_id}')">VOTE A</button></div><div class="answer">B: “${esc(m.b_answer)}”<button onclick="castVote('${m.matchup_id}','${m.b_id}')">VOTE B</button></div>`;$('voteStatus').textContent=votedMatch===m.matchup_id?'Vote locked in.':`${m.votes||0} vote(s) cast.`;$('scoreBtn').classList.toggle('hidden',!session.isHost);$('scoreBtn').dataset.mid=m.matchup_id}catch(e){toast(e.message)}}
window.castVote=async(mid,sid)=>{try{await rpc('cast_vote',{p_matchup_id:mid,p_player_id:session.player_id,p_player_token:session.player_token,p_submission_id:sid});votedMatch=mid;toast('Vote locked in');await loadMatchup()}catch(e){toast(e.message)}};
async function scoreMatch(){try{await rpc('score_current_matchup',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function nextMatch(){try{await rpc('next_matchup',{p_room_id:session.room_id,p_host_token:session.host_token});votedMatch='';await refresh(true)}catch(e){toast(e.message)}}
async function nextPrompt(){try{await rpc('next_prompt',{p_room_id:session.room_id,p_host_token:session.host_token});submittedKey='';votedMatch='';$('answerText').value='';$('analysisBox').classList.add('hidden');await refresh(true)}catch(e){toast(e.message)}}
async function restartGame(){if(!session?.isHost)return;if(!confirm('Restart the game? This will kick every player back to the main screen and delete the current room.'))return;try{await rpc('restart_game',{p_room_id:session.room_id,p_host_token:session.host_token});leave('Game restarted.')}catch(e){toast(e.message)}}
$('createBtn').onclick=createRoom;$('joinBtn').onclick=joinRoom;$('leaveBtn').onclick=()=>leave();$('startBtn').onclick=startGame;$('submitBtn').onclick=submitAnswer;$('votingBtn').onclick=prepareVoting;$('scoreBtn').onclick=scoreMatch;$('nextMatchBtn').onclick=nextMatch;$('nextPromptBtn').onclick=nextPrompt;document.querySelectorAll('.restart').forEach(b=>b.onclick=restartGame);
if(session){$('nick').value=session.name||'';refresh(true)}else show('home');setInterval(()=>{if(session)refresh(false)},1000);
</script>
</body></html>
