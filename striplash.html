function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}

racism=Math.min(100,hits(t,racialDirect)*90);sexism=Math.min(100,hits(t,sexistDirect)*65);antisemitism=Math.min(100,hits(t,antiDirect)*90);

if(/oven|gas chamber|auschwitz|holocaust/.test(t)&&/joke|funny|laugh|burn|cook|shower|smoke/.test(t))antisemitism=Math.max(antisemitism,70);

function metric(label,v){return `<div class="metric"><span>${label}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`}
function renderAnalysis(a){$('analysisBox').classList.remove('hidden');$('analysisBox').innerHTML=`<h3>DEGENERACY ANALYSIS</h3><div class="analysisScore">${a.score}</div><div class="small">OUT OF 100 · BONUS <b class="bonus">+${a.bonus}</b>${a.boring_penalty?` · BORING RISK <b style="color:var(--red)">-${a.boring_penalty}</b>`:''}</div>${metric('Sexual',a.sexual)}${metric('Dark',a.dark)}${metric('Gross-out',a.gross)}${metric('Profanity',a.profanity)}${metric('Context',a.context)}${metric('Racism',a.racism)}${metric('Sexism',a.sexism)}${metric('Antisemitism',a.antisemitism)}<p class="small">Racism, sexism and antisemitism are detection meters; they do not directly add bonus points.</p>`;if(a.antisemitism>=35)showAntisemitismRef()}

async function createRoom(){const name=$('nick').value.trim();if(!name)return toast('Enter a nickname first.');const a=nameAnalyze(name);try{const d=await rpc('create_room',{p_name:name,p_name_raunch:a.score,p_name_bonus:a.bonus});session={...d,name,isHost:true};save();await refresh(true)}catch(e){toast(e.message)}}

function render(){const r=snap.room,players=snap.players||[],me=players.find(x=>x.id===session.player_id);$('roomCode').textContent=r.code;document.querySelectorAll('.restart').forEach(b=>b.classList.toggle('hidden',!session.isHost));$('players').innerHTML=players.map(p=>`<div class="player"><span>${esc(p.name)} ${p.id===session.player_id?'(you)':''}</span><span class="small">READY</span></div>`).join('');

else if(r.status==='answering'){show('answer');if(me)showNameReveal(me);const promptKey=`${r.round_no}-${r.prompt_index}-${r.prompt_text}`;if(promptKey!==lastPromptKey){lastPromptKey=promptKey;submittedKey='';votedMatch='';$('answerText').value='';$('answerText').disabled=false;$('submitBtn').disabled=false;$('analysisBox').classList.add('hidden');$('analysisBox').innerHTML='';} $('roundLabel').textContent=`ROUND ${r.round_no} · PROMPT ${r.prompt_index}/3`;$('prompt').textContent=r.prompt_text;const key=r.round_no+'-'+r.prompt_index;if(key===submittedKey){$('answerText').disabled=true;$('submitBtn').disabled=true;$('answerStatus').textContent=`Locked in. ${snap.submitted}/${players.length} answers submitted.`}else{$('answerText').disabled=false;$('submitBtn').disabled=false;$('answerStatus').textContent=`${snap.submitted}/${players.length} answers submitted.`}$('votingBtn').classList.toggle('hidden',!(session.isHost&&snap.submitted>=2))}

async function nextPrompt(){try{await rpc('next_prompt',{p_room_id:session.room_id,p_host_token:session.host_token});await refresh(true)}catch(e){toast(e.message)}}
async function restartGame(){if(!session?.isHost)return;if(!confirm('Restart the game? This will kick every player back to the main screen and delete the current room.'))return;try{await rpc('restart_game',{p_room_id:session.room_id,p_host_token:session.host_token});leave('Game restarted.')}catch(e){toast(e.message)}}
$('createBtn').onclick=createRoom;$('joinBtn').onclick=joinRoom;$('leaveBtn').onclick=()=>leave();$('startBtn').onclick=startGame;$('submitBtn').onclick=submitAnswer;$('votingBtn').onclick=prepareVoting;$('scoreBtn').onclick=scoreMatch;$('nextMatchBtn').onclick=nextMatch;$('nextPromptBtn').onclick=nextPrompt;document.querySelectorAll('.restart').forEach(b=>b.onclick=restartGame);
if(session){$('nick').value=session.name||'';refresh(true)}else show('home');setInterval(()=>{if(session)refresh(false)},1000);
</script>
</body></html>
